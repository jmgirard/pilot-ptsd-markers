project:
  type: website
  output-dir: docs
  # Every report renders as a page of this site. Computed output is stored in
  # _freeze/ (tracked), so a project render reuses it and never re-runs a
  # report. To re-run one report, render it by name; see README.md.
  render:
    - index.qmd
    - "analyses/*.qmd"
  resources:
    - "data/*.csv"
    - ".nojekyll"

execute:
  freeze: true

website:
  title: "PTSD Behavioral Markers: Supplemental Materials"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Tables
        menu:
          - href: analyses/demographics.qmd
            text: Sample Demographics
          - href: analyses/feature_descriptives.qmd
            text: Behavioral Feature Descriptives
      - text: Analyses
        menu:
          - href: analyses/verbal_analyses.qmd
            text: Verbal Feature Analyses
          - href: analyses/vocal_analyses.qmd
            text: Vocal Feature Analyses
          - href: analyses/visual_analyses.qmd
            text: Visual Feature Analyses
    right:
      - icon: github
        href: https://github.com/jmgirard/pilot-ptsd-markers
  page-footer:
    center: "Code: [MIT](https://github.com/jmgirard/pilot-ptsd-markers/blob/main/LICENSE) · Content: [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"

format:
  html:
    theme: cosmo
    toc: true
